[package]
# Keep this browser/compiler package restricted to its declared attoc CLI.
# Legacy Rust entrypoints co-located under src/ belong to a separate crate.
autobins = false
# These suites belong to the browser Wasm crate; the legacy Cranelift tests
# are for the separate native/Cargo.toml package. Keep the explicit list
# exhaustive with scripts/verify-browser-cargo-tests.mjs.
autotests = false
name = "atto-compiler-browser"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "AttoLang subset compiler targeting browser WebAssembly, itself built for wasm32"

[lib]
name = "atto_compiler"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[[bin]]
name = "attoc"
path = "src/bin/attoc.rs"

# Browser compiler integration tests: explicit targets prevent Cargo from
# pulling legacy oreslang_source_rs/Cranelift tests into this crate.

