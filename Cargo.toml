[package]
name = "atto-compiler-browser"
version = "0.2.0"
edition = "2021"
# Only the browser compiler's explicitly declared attoc CLI is part of this
# package. Historical src/main.rs / src/bin/ci_verify.rs belong to a different
# compiler crate and reference undeclared dependencies; never auto-discover
# them as additional binaries during cargo test / build.
autobins = false
license = "MIT"
description = "AttoLang subset compiler targeting browser WebAssembly, itself built for wasm32"

[lib]
name = "atto_compiler"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[[bin]]
name = "attoc"
path = "src/bin/attoc.rs"
