[package]
name = "oreslang-source-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
logos = "0.16.1"
cranelift = { version = "0.136.3", features = ["module", "object", "native"] }
serde_json = "1.0"

[[bin]]
name = "oresc"
path = "src/main.rs"

# Native-only legacy suites excluded from the canonical browser crate.
# Keep native/tests/ auto-discovery ON; register only distinct root tests.
