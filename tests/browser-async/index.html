<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Atto compiler browser ABI E2E</title>
<h1>Atto browser compiler acceptance harness</h1>
<textarea id="source" rows="5" cols="70">pub fnc main(): int { return 6 * 7; }</textarea>
<button id="run">Compile and run</button><pre id="result">Ready</pre>
<script type="module">
const editor=document.querySelector('#source'),out=document.querySelector('#result'),button=document.querySelector('#run');
let last=0;
button.addEventListener('click',()=>{
  const id=++last;
  const worker=new Worker('/worker.mjs',{type:'module'});
  button.disabled=true;out.textContent='Compiling';
  const timer=setTimeout(()=>{worker.terminate();if(id===last){out.textContent='E_TIMEOUT';button.disabled=false}},5000);
  worker.onmessage=event=>{clearTimeout(timer);worker.terminate();if(id!==last)return;window.__attoLastCooperativeYields=event.data.cooperativeYields??0;window.__attoLastSchedulerDispatches=event.data.schedulerDispatches??0;window.__attoLastPortableTurns=event.data.portableTurns??0;window.__attoLastPortableResumes=event.data.portableResumes??0;window.__attoLastPortableCleanups=event.data.portableCleanups??0;window.__attoV4Peak=event.data.portableV4Peak??0;window.__attoV4Turns=event.data.portableV4Turns??0;window.__attoV4Resumes=event.data.portableV4Resumes??0;window.__attoV4Cleanups=event.data.portableV4Cleanups??0;window.__attoV5Peak=event.data.portableV5Peak??0;window.__attoV5Starts=event.data.portableV5Starts??0;window.__attoV5Completions=event.data.portableV5Completions??0;window.__attoV5Resumes=event.data.portableV5Resumes??0;window.__attoV5Drops=event.data.portableV5Drops??0;out.textContent=event.data.ok?event.data.stdout+'main() -> '+event.data.value:event.data.error;button.disabled=false};
  worker.onerror=()=>{clearTimeout(timer);worker.terminate();if(id===last){out.textContent='E_WORKER';button.disabled=false}};
  worker.postMessage({source:editor.value,portableV3:window.__attoPortableV3===true,portableV4:window.__attoPortableV4===true,portableV5:window.__attoPortableV5===true,portableFutureInt:window.__attoFutureIntAot===true});
});
window.__attoReady=true;
</script>
</html>
