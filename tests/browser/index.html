<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Atto compiler browser ABI E2E</title>
<h1>Atto browser compiler acceptance harness</h1>
<textarea id="source" rows="5" cols="70">pub fnc main(): int { return 6 * 7; }</textarea>
<button id="run">Compile and run</button><pre id="result">Ready</pre>
<script type="module">

import { BrowserRunSession } from './run-watchdog.mjs';
const editor=document.querySelector('#source'),out=document.querySelector('#result'),button=document.querySelector('#run');
let active=null;
button.addEventListener('click',()=>{
  if(active?.state==='running')return;
  button.disabled=true;out.textContent='Compiling';
  try {
    const worker=new Worker('/worker.mjs',{type:'module'});
    active=new BrowserRunSession(
      worker,
      {source:editor.value,actorMessages:window.__attoActorMessages},
      result=>{
        out.textContent=result.ok?result.stdout+'main() -> '+result.value:result.error;
        button.disabled=false;
      }
    );
  } catch {
    button.disabled=false;
    out.textContent='E_WORKER_START';
  }
});
window.__attoReady=true;
</script>
</html>
