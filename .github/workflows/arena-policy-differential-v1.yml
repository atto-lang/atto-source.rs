name: Compiled arena policy differential guest
on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'stdlib/policy/**'
      - 'tests/arena-policy-differential-v1.mjs'
      - 'tests/arena-quota-lifecycle-guest.mjs'
      - 'tests/fixtures/arena-quota-lifecycle-guest.atto'
      - '.github/workflows/arena-policy-differential-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          test "$(git hash-object tests/arena-policy-differential-v1.mjs)" = f98055af7bb9b8952664946d2b2a1f3a735dc283
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release --bin attoc
          ATTOC="$PWD/target/release/attoc" node tests/arena-quota-lifecycle-guest.mjs
