name: Rust LLVM AOT adapter exact-head native guest

on:
  pull_request:
    paths:
      - 'experimental/llvm-aot/**'
      - 'tests/llvm_aot_frontend_ownership.rs'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/llvm-aot-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'experimental/llvm-aot/**'
      - 'tests/llvm_aot_frontend_ownership.rs'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/llvm-aot-adapter.yml'

permissions:
  contents: read

jobs:
  native-llvm-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Compile and execute actual LLVM native guest
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash experimental/llvm-aot/ci/verify-native-guest.sh
