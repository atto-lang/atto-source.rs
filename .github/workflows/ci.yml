name: Portable Atto frontend and browser Wasm conformance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_head:
        description: 'Exact 40-character source PR head SHA; reject drift'
        required: true
        type: string
      expected_tree:
        description: 'Exact 40-character Git tree SHA to verify checkout contents'
        required: true
        type: string
permissions:
  contents: read
jobs:
  real-compiler:
    # Source-local, administrator-provisioned, unique-label private runner.
    # Pull-request and push events continue using hosted ubuntu-24.04.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && (vars.ATTO_PRIVATE_RUST_RUNNER_LABEL || 'atto-source-local-runner-not-configured') || 'ubuntu-24.04' }}
    steps:
      - name: Reject manual dispatch SHA drift before checking out private source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          DISPATCH_HEAD: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_NAME: ${{ runner.name }}
          SELECTED_RUNNER_LABEL: ${{ vars.ATTO_PRIVATE_RUST_RUNNER_LABEL }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD" = "$DISPATCH_HEAD"
          test "$SOURCE_REPOSITORY" = "atto-lang/atto-source.rs"
          test "$SOURCE_REF_TYPE" = "branch"
          test -n "$SELECTED_RUNNER_LABEL"
          test "$RUNNER_ENVIRONMENT" = "self-hosted"
          test -n "$RUNNER_NAME"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind checkout to exact head/tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree || '' }}
          SOURCE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          ACTUAL_TREE=$(git rev-parse 'HEAD^{tree}')
          [[ "$ACTUAL_TREE" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$SOURCE_EVENT" == "workflow_dispatch" ]]; then
            [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
            test "$ACTUAL_TREE" = "$EXPECTED_TREE"
          fi
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code HEAD --
          test "$(git write-tree)" = "$ACTUAL_TREE"
          printf 'EXACT_SOURCE_VERIFIED head=%s tree=%s\n' "$EXPECTED_HEAD" "$ACTUAL_TREE"
      - name: Verify byte-identical canonical AOT copy admission source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/copy_graph_v1.rs)" = "3008a139cfba41131839de3567a263163152cf00"
          echo "CANONICAL_COPY_GRAPH_SHA_VERIFIED=3008a139cfba41131839de3567a263163152cf00"
      - name: Install pinned Rust toolchain and Wasm target
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup component add clippy rustfmt --toolchain 1.85.1
          rustup default 1.85.1
          rustc --version
      - name: Check formatting on the entire browser compiler crate
        run: cargo fmt --all -- --check
      - name: Syntax-check the conditional native and browser guest oracles
        run: |
          node --check tests/ifnot_unless_guest.mjs
          node --check tests/ifnot_unless_browser_compiler.mjs
      - name: Test ifnot/unless Rust compiler grammar and fail-closed diagnostics
        run: cargo test --locked --test ifnot_unless_guest
      - name: Test native compiler core over the fixture corpus
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --locked --verbose
      - name: Strict Rust Clippy all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build native attoc host
        run: cargo build --locked --release --bin attoc
      - name: Execute AOT closed-world guests and reject runtime compilation fallbacks
        env:
          ATTOC: target/release/attoc
        run: node tests/aot_no_fallback_guest.mjs
      - name: Execute real native-compiled output I/O shorthand guest in Wasm
        env:
          ATTOC: target/release/attoc
        run: node tests/io_shorthand_guest.mjs
      - name: Execute bitwise operators in native-generated Wasm guests
        env:
          ATTOC: target/release/attoc
        run: node tests/bitwise_guest.mjs
      - name: Execute negated conditional expression and statement Wasm guests
        env:
          ATTOC: target/release/attoc
        run: node tests/ifnot_unless_guest.mjs
      - name: Build actual Wasm compiler
        run: |
          cargo rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          sha256sum target/wasm32-unknown-unknown/release/atto_compiler.wasm
      - name: Prove ifnot/unless native vs wasm32 browser compiler byte parity and real guests
        env:
          ATTOC: target/release/attoc
        run: node tests/ifnot_unless_browser_compiler.mjs
      - name: Compile exact bitwise preview inside browser Wasm compiler and compare native guest bytes
        env:
          ATTOC: target/release/attoc
        run: node tests/bitwise_browser_compiler.mjs
      - name: Reject adversarial mailbox histories before compiled guest tests
        run: node --test tests/actor-trace-refinement.test.mjs
      - name: Conformance - wasm32 compiler, guest execution, native-vs-wasm byte parity
        env:
          ATTOC: target/release/attoc
        run: node tests/conformance.mjs

      - name: Shared scalar-v1 native vs wasm32 byte parity with guest execution
        env:
          ATTOC: target/release/attoc
        run: node --test tests/shared-scalar-v1.test.mjs

      - name: Execute five callable forms and class mtd guest with negative no-artifact proofs
        env:
          ATTOC: target/release/attoc
        run: node tests/callable_guest_execution.mjs
      - name: Compile and execute physical AoS SoA AoSoA guest layouts
        env:
          ATTOC: target/release/attoc
        run: node tests/collection-layout-guest-execution.mjs
      - name: Execute checked monomorphic Any type tests, captures and rejection oracles
        env:
          ATTOC: target/release/attoc
        run: node tests/type_casting_guest_execution.mjs

      - name: Compile and execute canonical copy!! scalar and flat-class Wasm guests
        env:
          ATTOC: target/release/attoc
        run: |
          node --check tests/copy_doublebang_guest.mjs
          node tests/copy_doublebang_guest.mjs
      - name: Execute defer/recover/try/raise unwind guests against spec trace oracles
        env:
          ATTOC: target/release/attoc
        run: node tests/defer_recover_guest.mjs

      - name: Execute recursive guests against the logical call-depth quota (spec 25)
        env:
          ATTOC: target/release/attoc
        run: node tests/call_depth_guest.mjs

      - name: Target-only actor receiver Wasm ABI rejects unsupported code
        run: node tests/target_syntax_wasm.mjs

      - name: Real Chromium browser and worker E2E
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/browser-e2e.mjs
      - name: Build immutable compiler artifact receipt
        run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/atto_compiler.wasm dist/atto_compiler.wasm
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const bytes = fs.readFileSync('dist/atto_compiler.wasm');
          const module = new WebAssembly.Module(bytes);
          const imports = WebAssembly.Module.imports(module);
          const exports = WebAssembly.Module.exports(module).map(x => x.name);
          const required = ['memory','abi_version','input_ptr','input_capacity','compile','result_ptr','result_length','error_ptr','error_line_number','error_column_number'];
          if (imports.length || required.some(x => !exports.includes(x))) throw new Error('unexpected compiler ABI');
          const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
          const receipt = {
            schema:'atto.browser.compiler.artifact.v1',
            source_head:git('rev-parse','HEAD'),
            source_tree:git('rev-parse','HEAD^{tree}'),
            target:'wasm32-unknown-unknown',
            abi:'atto-playground-v2',
            guest_abi:'atto.browser.guest.v2',
            compiler_sha256:crypto.createHash('sha256').update(bytes).digest('hex'),
            compiler_bytes:bytes.length,
            import_count:imports.length,
            exports
          };
          fs.writeFileSync('dist/receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(receipt);
          JS
      - name: Publish verified compiler plus provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atto-compiler-wasm32-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
