name: Rust compiler checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Export closed-world scalar MIR effects
        run: |
          cargo run --locked --bin oresc -- --emit-effect-ir examples/answer.ores target/answer-effect-ir.json
          python3 -c 'import json; p=json.load(open("target/answer-effect-ir.json")); assert p["schema_version"] == 1; assert [f["name"] for f in p["functions"]] == ["answer"]; assert all(f["operations"] == [] for f in p["functions"])'
      - name: Compile, link and execute native object
        run: |
          cargo run --locked --bin oresc -- examples/answer.ores target/answer.o
          cc target/answer.o examples/driver.c -o target/answer
          ./target/answer
