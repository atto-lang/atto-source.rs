name: Portable Atto frontend and browser Wasm conformance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind checkout to exact head/tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install pinned Rust toolchain and Wasm target
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.85.1
          rustc --version
      - name: Test native compiler core over the fixture corpus
        run: cargo test --locked --verbose
      - name: Build native attoc host
        run: cargo build --locked --release --bin attoc
      - name: Execute real native-compiled output I/O shorthand guest in Wasm
        env:
          ATTOC: target/release/attoc
        run: node tests/io_shorthand_guest.mjs
      - name: Build actual Wasm compiler
        run: |
          cargo rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          sha256sum target/wasm32-unknown-unknown/release/atto_compiler.wasm
      - name: Execute borrow-v1 compiler guests and zero-artifact ownership negatives
        env:
          ATTOC: target/release/attoc
          EXPECTED_BORROW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node tests/borrow_v1_guest.mjs \
            target/wasm32-unknown-unknown/release/atto_compiler.wasm \
            | tee "$RUNNER_TEMP/borrow-v1-evidence.log"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const text = fs.readFileSync(process.env.RUNNER_TEMP + '/borrow-v1-evidence.log','utf8');
          const line = text.split(/\r?\n/).find(x=>x.startsWith('ATTO_BORROW_V1_EVIDENCE='));
          assert.ok(line,'missing machine-readable compiler guest receipt');
          const receipt = JSON.parse(line.slice('ATTO_BORROW_V1_EVIDENCE='.length));
          const git = (...args) => execFileSync('git',args,{encoding:'utf8'}).trim();
          assert.equal(receipt.schema,'atto.borrow-v1.guest-evidence.v1');
          assert.equal(receipt.evidence_category,'COMPILED_GUEST');
          assert.equal(receipt.status,'PASSED');
          assert.equal(receipt.source_head,process.env.EXPECTED_BORROW_HEAD);
          assert.equal(receipt.source_tree,git('rev-parse','HEAD^{tree}'));
          assert.equal(receipt.positive_fixtures,6);
          assert.equal(receipt.negative_fixtures,14);
          assert.equal(receipt.executed_cases,20);
          assert.equal(receipt.cases.length,20);
          assert.match(receipt.native_compiler_sha256,/^[a-f0-9]{64}$/);
          assert.match(receipt.browser_compiler_sha256,/^[a-f0-9]{64}$/);
          assert.ok(receipt.compiler_toolchain.length>0);
          assert.equal(receipt.target,'wasm32-unknown-unknown');
          assert.ok(receipt.cases.every(x=>x.status==='PASSED' && x.category==='COMPILED_GUEST'));
          assert.ok(receipt.cases.every(x=>/^[a-f0-9]{64}$/.test(x.fixture_sha256)));
          assert.ok(receipt.cases.filter(x=>x.expected.compile==='success').every(x=>
            x.actual.guest_exit===String(x.expected.browser_exit) &&
            x.actual.native_compile_exit===0 && x.actual.browser_compile==='success'));
          assert.ok(receipt.cases.filter(x=>x.expected.compile==='rejected').every(x=>
            x.actual.browser_diagnostic===x.expected.diagnostic &&
            x.actual.native_diagnostic_contains_expected &&
            x.actual.browser_artifact_bytes===0 && x.actual.native_artifact_bytes===0));
          fs.mkdirSync('target/evidence',{recursive:true});
          fs.writeFileSync('target/evidence/borrow-v1-evidence.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('BORROW_V1_RECEIPT_VALIDATED=PASS');
          JS
          echo 'BORROW_V1_COMPILED_GUEST=EXECUTED; SOURCE_ONLY_MODEL=FALSE'

      - name: Reject adversarial mailbox histories before compiled guest tests
        run: node --test tests/actor-trace-refinement.test.mjs
      - name: Conformance - wasm32 compiler, guest execution, native-vs-wasm byte parity
        env:
          ATTOC: target/release/attoc
        run: node tests/conformance.mjs

      - name: Execute five callable forms and class mtd guest with negative no-artifact proofs
        env:
          ATTOC: target/release/attoc
        run: node tests/callable_guest_execution.mjs

      - name: Execute defer/recover/try/raise unwind guests against spec trace oracles
        env:
          ATTOC: target/release/attoc
        run: node tests/defer_recover_guest.mjs

      - name: Target-only actor receiver Wasm ABI rejects unsupported code
        run: node tests/target_syntax_wasm.mjs

      - name: Real Chromium browser and worker E2E
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/browser-e2e.mjs
      - name: Build immutable compiler artifact receipt
        run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/atto_compiler.wasm dist/atto_compiler.wasm
          cp target/evidence/borrow-v1-evidence.json dist/borrow-v1-evidence.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const bytes = fs.readFileSync('dist/atto_compiler.wasm');
          const module = new WebAssembly.Module(bytes);
          const imports = WebAssembly.Module.imports(module);
          const exports = WebAssembly.Module.exports(module).map(x => x.name);
          const required = ['memory','abi_version','input_ptr','input_capacity','compile','result_ptr','result_length','error_ptr','error_line_number','error_column_number'];
          if (imports.length || required.some(x => !exports.includes(x))) throw new Error('unexpected compiler ABI');
          const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
          const receipt = {
            schema:'atto.browser.compiler.artifact.v1',
            source_head:git('rev-parse','HEAD'),
            source_tree:git('rev-parse','HEAD^{tree}'),
            target:'wasm32-unknown-unknown',
            abi:'atto-playground-v2',
            guest_abi:'atto.browser.guest.v2',
            compiler_sha256:crypto.createHash('sha256').update(bytes).digest('hex'),
            compiler_bytes:bytes.length,
            import_count:imports.length,
            exports
          };
          fs.writeFileSync('dist/receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(receipt);
          JS
      - name: Publish verified compiler plus provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atto-compiler-wasm32-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
