name: Rust compiler checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Export closed-world scalar MIR effects
        run: |
          cargo run --locked --bin oresc -- --emit-effect-ir examples/answer.ores target/answer-effect-ir.json
          python3 -c 'from pathlib import Path; import json, hashlib; actual=Path("target/answer-effect-ir.json").read_text(); expected=Path("examples/scalar-effect-ir-v1.json").read_text().strip(); assert actual == expected, "scalar compiler golden fixture mismatch"; assert hashlib.sha256(actual.encode()).hexdigest() == "8ee1adbf6faef704c1eb6d2b2075c3b2d723097037f646f9e6e518a69d005463"; p=json.loads(actual); assert [f["name"] for f in p["functions"]] == ["answer"]; assert len(p["functions"][0]["operations"]) == 3'
      - name: Compile, link and execute native object
        run: |
          cargo run --locked --bin oresc -- examples/answer.ores target/answer.o
          cc target/answer.o examples/driver.c -o target/answer
          ./target/answer
