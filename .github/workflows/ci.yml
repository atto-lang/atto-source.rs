name: Portable Atto frontend and browser Wasm conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind checkout to exact head/tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install pinned Rust toolchain and Wasm target
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.85.1
          rustc --version
      - name: Test native portable frontend and typed IR
        run: cargo test --locked --verbose
      - name: Build actual Wasm compiler
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown
          sha256sum target/wasm32-unknown-unknown/release/atto_compiler.wasm
      - name: Execute source-dependent generated guest Wasm in Node VM
        run: node tests/wasm-browser.mjs
