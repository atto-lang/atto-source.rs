name: Private CI deny-by-default policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  private-ci-deny-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind policy validation to exact source revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code HEAD --
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
      - name: Exercise binary-safe policy classifier with synthetic source-free cases
        shell: bash
        run: bash tests/private-ci-export-policy-guard-test.sh
      - name: Require private source export to remain disabled
        shell: bash
        run: bash scripts/private-ci-export-policy-guard.sh .github/private-ci-approved-repositories.txt
