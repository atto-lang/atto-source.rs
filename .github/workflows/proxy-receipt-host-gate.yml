name: Rust proxy ACK host-only receipt gate
on:
  pull_request:
    paths: [ 'src/proxy_receipt_gate_v1.rs', 'tests/proxy_receipt_gate_v1.rs', 'src/proxy_mailbox_ticket_v1.rs', 'tests/proxy_mailbox_ticket_v1.rs', 'src/lib.rs', '.github/workflows/proxy-receipt-host-gate.yml' ]
  push:
    paths: [ 'src/proxy_receipt_gate_v1.rs', 'tests/proxy_receipt_gate_v1.rs', 'src/proxy_mailbox_ticket_v1.rs', 'tests/proxy_mailbox_ticket_v1.rs', 'src/lib.rs', '.github/workflows/proxy-receipt-host-gate.yml' ]
permissions:
  contents: read
jobs:
  source-host-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          cargo test --locked --test proxy_receipt_gate_v1
          cargo test --locked --test proxy_mailbox_ticket_v1
      - run: echo 'HOST_MODEL_ONLY; no authenticated IPC or compiled .atto guest evidence'
