name: Rust incremental linked build
on:
  pull_request:
    paths:
      - 'src/incremental.rs'
      - 'src/linker.rs'
      - 'src/lexer.rs'
      - 'src/sha256.rs'
      - 'src/borrow_export.rs'
      - 'stdlib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/multihop_linker.rs'
      - 'src/library.rs'
      - 'src/lib.rs'
      - 'tests/incremental_build.rs'
      - '.github/workflows/incremental-linked-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Execute real compiler cache and linker tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD HEAD^{tree}
          rustc --version
          cargo test --locked --test incremental_build --test multihop_linker
          cargo test --locked --lib incremental::tests
