name: Canonical caret-return and double-caret XOR exact-head guest checks

on:
  push:
    branches:
      - fix/match-caret-main-20261119
  pull_request:
    paths:
      - 'src/lexer.rs'
      - 'src/parser.rs'
      - 'src/ast.rs'
      - 'src/check.rs'
      - 'src/wasm.rs'
      - 'tests/bitwise*'
      - 'tests/float*'
      - 'tests/fixtures/pass/bitwise-*'
      - 'tests/fixtures/fail/bitwise-*'
      - 'tests/fixtures/pass/float-int-division.atto'
      - 'tests/fixtures/fail/float-division-into-int.atto'
      - 'tests/fixtures/pass/match-caret-xor-coexist.atto'
      - '.github/workflows/caret-double-xor-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiled-caret-xor-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Source checkout exactly event-pinned head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject source identity mismatch or dirty tree
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'RECEIPT source_sha=%s tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
      - name: Install pinned Rust 1.85.1 and Wasm compiler target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.85.1
          rustc --version
          node --version
      - name: Compile real parser unit and negative/no-artifact fixtures
        env:
          RUST_MIN_STACK: '16777216'
        run: cargo test --locked --test bitwise_ops --test fixtures
      - name: Build production native attoc
        run: cargo build --locked --release --bin attoc
      - name: Execute generated Wasm and prove old caret leaves no artifacts
        env:
          ATTOC: target/release/attoc
        run: node tests/bitwise_guest.mjs
      - name: Build source-exact wasm32-hosted compiler
        run: >-
          cargo rustc --locked --release --lib
          --target wasm32-unknown-unknown --crate-type cdylib
          -- -C link-arg=--max-memory=67108864
      - name: Execute wasm32 compiler generated guest and native byte equality
        env:
          ATTOC: target/release/attoc
        run: node tests/bitwise_browser_compiler.mjs
      - name: Report bounded proof only
        run: |
          echo 'RECEIPT scope=rust_native_compiler+wasm32_compiler+compiled_wasm_guest'
          echo 'RECEIPT java_llvm_net_forge=NOT_EXECUTED'
