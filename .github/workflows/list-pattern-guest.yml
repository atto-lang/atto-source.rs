name: Restricted List pattern guest (exact head)
on:
  push:
    paths:
      - 'src/list_pattern_guest.rs'
      - 'src/lib.rs'
      - 'tests/list_pattern_guest.rs'
      - 'tests/list-pattern-guest-execution.mjs'
      - 'scripts/verify-list-pattern-guest.sh'
      - 'tests/fixtures/pass/list-pattern-*.atto'
      - '.github/workflows/list-pattern-guest.yml'
  pull_request:
    paths:
      - 'src/list_pattern_guest.rs'
      - 'src/lib.rs'
      - 'tests/list_pattern_guest.rs'
      - 'tests/list-pattern-guest-execution.mjs'
      - 'scripts/verify-list-pattern-guest.sh'
      - 'tests/fixtures/pass/list-pattern-*.atto'
      - '.github/workflows/list-pattern-guest.yml'
permissions:
  contents: read
jobs:
  source-compiled-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact git head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup component add clippy --toolchain 1.85.1
          rustup default 1.85.1
          rustc --version
      - name: Verify checked Rust compiler and execute generated guest Wasm
        env:
          ATTO_EXPECT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify-list-pattern-guest.sh
