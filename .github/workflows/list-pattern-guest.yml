name: Restricted List pattern guest (exact head)
on:
  push:
    paths:
      - 'src/list_pattern_guest.rs'
      - 'src/lib.rs'
      - 'tests/list_pattern_guest.rs'
      - 'tests/list-pattern-guest-execution.mjs'
      - 'tests/fixtures/pass/list-pattern-*.atto'
      - '.github/workflows/list-pattern-guest.yml'
  pull_request:
    paths:
      - 'src/list_pattern_guest.rs'
      - 'src/lib.rs'
      - 'tests/list_pattern_guest.rs'
      - 'tests/list-pattern-guest-execution.mjs'
      - 'tests/fixtures/pass/list-pattern-*.atto'
      - '.github/workflows/list-pattern-guest.yml'
permissions:
  contents: read
jobs:
  source-compiled-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact git head
        run: |
          git rev-parse HEAD
          git status --porcelain
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc7559869bbbf0e66b5c6c80c891936b2 # stable toolchain action
        with:
          toolchain: stable
          components: clippy
      - name: Production Rust compiler and fail-closed tests
        run: |
          cargo test --locked --test list_pattern_guest --test typed_seq_fragment_admission --test sequence_v2_fail_closed
          cargo clippy --locked --all-targets -- -D warnings
      - name: Compile production attoc
        run: cargo build --locked --release --bin attoc
      - name: Execute produced guest Wasm and no-artifact negatives
        run: ATTOC=target/release/attoc node tests/list-pattern-guest-execution.mjs
