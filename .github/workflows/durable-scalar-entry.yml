name: Durable scalar entry ABI
on:
  pull_request:
    paths:
      - 'src/lib.rs'
      - 'src/wasm.rs'
      - 'src/bin/attoc.rs'
      - 'tests/durable-scalar-entry-guest.mjs'
      - '.github/workflows/durable-scalar-entry.yml'
permissions:
  contents: read
jobs:
  wasm-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and execute exact-head real guests
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release --bin attoc
          ATTOC="$PWD/target/release/attoc" node tests/durable-scalar-entry-guest.mjs
