name: Actor string DATA codec (Rust source-only)

on:
  pull_request:
    paths:
      - 'src/actor_string_mail.rs'
      - 'src/actor_string_memory_plan.rs'
      - 'tests/browser/actor-string-bridge.mjs'
      - 'tests/browser/actor-string-bridge.test.mjs'
      - 'src/lib.rs'
      - 'docs/typed-actor-message-contracts.md'
      - '.github/workflows/actor-string-mail-codec.yml'
  push:
    paths:
      - 'src/actor_string_mail.rs'
      - 'src/actor_string_memory_plan.rs'
      - 'tests/browser/actor-string-bridge.mjs'
      - 'tests/browser/actor-string-bridge.test.mjs'
      - 'src/lib.rs'
      - 'docs/typed-actor-message-contracts.md'
      - '.github/workflows/actor-string-mail-codec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-rust-codec-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Compile exact bounded UTF-8 codec module and run adversarial unit tests
        run: |
          rustc --version
          mkdir -p target
          rustc --edition=2021 --test -D warnings src/actor_string_mail.rs -o target/atto-actor-string-mail-tests
          target/atto-actor-string-mail-tests --nocapture
          rustc --edition=2021 --test -D warnings src/actor_string_memory_plan.rs -o target/atto-actor-string-layout-tests
          target/atto-actor-string-layout-tests --nocapture
      - name: Assert guest-ABI boundary remains explicitly unverified
        run: |
          grep -q 'not a guest messaging implementation' src/actor_string_mail.rs
          grep -q 'NOT_EXECUTED' docs/typed-actor-message-contracts.md

  host-string-bridge-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: '22'
      - name: Exercise bounded Wasm-memory DATA bridge (host-only, NOT guest parity)
        run: |
          node --version
          node --test tests/browser/actor-string-bridge.test.mjs
