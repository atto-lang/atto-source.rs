name: Atto HTTP routing scalar guest - compiled Wasm proof

on:
  push:
    branches:
      - 'feat/http-routing-scalar-guest-baseline-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-guest-scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact local branch, no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify checkout identity and record Git tree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          rustc --version
          cargo --version
          node --version
      - name: Compile and EXECUTE scalar routing Atto guest plus blocked-feature diagnostics
        run: cargo test --locked --test routing_guest_baseline -- --nocapture
      - name: Verify shared compiler positive/negative fixture corpus
        run: cargo test --locked --test fixtures -- --nocapture
      - name: Install pinned wasm32 target for independent browser compiler host
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.85.1
          rustc --version
      - name: Build native compiler and wasm32 compiler from the same pinned tree
        run: |
          cargo build --locked --release --bin attoc
          cargo rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
      - name: Execute browser compiler guest corpus and compare bytes with native compiler
        env:
          ATTOC: target/release/attoc
        run: node tests/conformance.mjs
