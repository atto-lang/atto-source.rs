name: Actor job envelope v0 Rust codec (host-only)

on:
  push:
    paths:
      - 'src/job_envelope.rs'
      - 'src/lib.rs'
      - '.github/workflows/actor-job-wire-codec-v0.yml'
  pull_request:
    paths:
      - 'src/job_envelope.rs'
      - 'src/lib.rs'
      - '.github/workflows/actor-job-wire-codec-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-rust-codec-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Compile exact Rust framing module and run its unit tests
        run: |
          rustc --version
          mkdir -p target
          rustc --edition=2021 --test -D warnings src/job_envelope.rs -o target/atto-job-envelope-codec-tests
          target/atto-job-envelope-codec-tests --nocapture
      - name: Enforce host-only scope label
        run: |
          grep -q 'not called by the Atto parser' src/job_envelope.rs
          grep -q 'NOT a' docs/actor-job-wire-v0.md
