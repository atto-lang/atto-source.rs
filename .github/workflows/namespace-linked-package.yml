name: Atto namespace-linked package guest
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/namespace-linked-package.yml'
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/namespace-linked-package.yml'
permissions:
  contents: read
jobs:
  namespace-linked:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Test exact storefront namespace and import
        run: cargo +1.85.1 test --locked --test namespace_storefront -- --nocapture
      - name: Test package resolver, linked graph and CLI
        run: cargo +1.85.1 test --locked --test package_resolver --test package_cli --test multihop_linker
      - name: Execute storefront source-compiled guest (stdout 49; main 0)
        run: |
          cargo +1.85.1 run --locked --quiet --example namespace_storefront_guest -- /tmp/storefront.wasm
          node tests/namespace_storefront_wasm.test.mjs /tmp/storefront.wasm
      - name: Execute four other linked Wasm guests
        run: |
          cargo +1.85.1 run --locked --quiet --example linked_guest -- /tmp/public.wasm /tmp/package.wasm /tmp/deep.wasm /tmp/fs.wasm
          node tests/linked_guest_wasm.test.mjs /tmp/public.wasm /tmp/package.wasm /tmp/deep.wasm /tmp/fs.wasm
      - name: Full Rust regression suite
        run: cargo +1.85.1 test --locked --all-targets
      - name: Rust formatting check
        run: cargo +1.85.1 fmt --all -- --check
