name: Rust scalar pull-push fail-closed parity gate
on:
  pull_request:
    paths:
      - 'tests/pull_push_unsupported_gate.rs'
      - '.github/workflows/pull-push-parity-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
          git hash-object 'tests/pull_push_unsupported_gate.rs'
      - name: Run real Rust frontend negative and positive compiler cases
        run: cargo test --locked --test pull_push_unsupported_gate
