name: Atto package linker and visibility security
on:
  pull_request:
    paths:
      - "src/linker.rs"
      - "src/package_resolver.rs"
      - "src/visibility_lower.rs"
      - "src/module_lower.rs"
      - "src/bin/attoc.rs"
      - "examples/linked_guest.rs"
      - "tests/linked_*"
      - "tests/multihop_linker.rs"
      - "tests/package_resolver.rs"
      - "tests/package_cli.rs"
      - ".github/workflows/package-linker.yml"
  push:
    paths:
      - "src/linker.rs"
      - "src/package_resolver.rs"
      - "src/bin/attoc.rs"
      - "tests/multihop_linker.rs"
      - "tests/package_resolver.rs"
      - "tests/package_cli.rs"
      - ".github/workflows/package-linker.yml"
permissions:
  contents: read
jobs:
  browser-package-linker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Check compiler, package and export contracts
        shell: bash
        run: |
          cargo +1.85.1 test --locked --lib \
            --test exports \
            --test linked_imports \
            --test multihop_linker \
            --test package_resolver \
            --test package_cli \
            --test module_export_visibility \
            --test preview_visibility \
            --test visibility_modifier_boundaries
      - name: Emit four linked guest WebAssembly binaries
        shell: bash
        run: |
          cargo +1.85.1 run --locked --quiet --example linked_guest -- \
            /tmp/atto-public.wasm /tmp/atto-package.wasm \
            /tmp/atto-deep.wasm /tmp/atto-filesystem.wasm
      - name: Execute all linked Wasm guests in Node
        shell: bash
        run: |
          node tests/linked_guest_wasm.test.mjs \
            /tmp/atto-public.wasm /tmp/atto-package.wasm \
            /tmp/atto-deep.wasm /tmp/atto-filesystem.wasm
