name: Arena quota and lifecycle actual scalar Wasm guest
on:
  pull_request:
    paths:
      - 'stdlib/policy/core/arena_limits.atto'
      - 'stdlib/policy/alloc/arena_lifecycle.atto'
      - 'tests/arena-quota-lifecycle*'
      - 'tests/fixtures/arena-quota-lifecycle-guest.atto'
      - '.github/workflows/arena-quota-lifecycle-guest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact head and root tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD^{tree}
          test -z "$(git status --porcelain)"
      - run: node --test tests/arena-quota-lifecycle-source.test.mjs
      - run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release --bin attoc
          sha256sum target/release/attoc
      - run: node tests/arena-quota-lifecycle-guest.mjs
      - name: Verify original source remains unchanged
        run: git diff --exit-code
