name: Rust-to-Wasm browser compiler exact-head guest

on:
  # Always test code, test-only, manifest, and CI-script changes. Avoid
  # a path-filter blind spot that would silently skip compiler regressions.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-rust-browser-compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact Rust toolchain and wasm32 guest target
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.85.1
      - name: Real Rust compiler Wasm plus guest execution and native differential
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ci/verify-rust-browser-wasm.sh
