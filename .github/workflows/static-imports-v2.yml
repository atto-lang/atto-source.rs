name: Static import v2 focused checks
on:
  pull_request:
    paths:
      - 'src/import_v2.rs'
      - 'src/target_syntax.rs'
      - 'src/library.rs'
      - 'src/lib.rs'
      - 'tests/static_imports_v2.rs'
      - '.github/workflows/static-imports-v2.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact head and test actual compiler
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD HEAD^{tree}
          rustc --version
          cargo test --locked --test static_imports_v2 --test unified_imports
