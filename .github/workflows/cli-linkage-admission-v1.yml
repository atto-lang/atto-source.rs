name: Rust CLI linkage admission
on:
  pull_request:
    paths:
      - 'src/bin/attoc.rs'
      - 'tests/cli_linkage_admission.rs'
      - '.github/workflows/cli-linkage-admission-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source and run real compiler CLI test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD HEAD^{tree}
          rustc --version
          cargo --version
          cargo test --locked --test cli_linkage_admission -- --nocapture
