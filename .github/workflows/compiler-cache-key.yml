name: Compiler cache key envelope conformance
on:
  pull_request:
    paths:
      - 'src/compiler_cache_key.rs'
      - 'src/lib.rs'
      - 'src/compiler_artifact_receipt.rs'
      - 'src/compiler_artifact_store.rs'
      - 'src/compiler_artifact_store/authority.rs'
      - 'tests/fixtures/incremental_locked/**'
      - 'src/secure_fs.rs'
      - 'src/compiler_cache_witness.rs'
      - 'src/compiler_cache_key_policy.rs'
      - 'src/library.rs'
      - 'src/package_resolver.rs'
      - 'src/linker.rs'
      - 'src/compiler_cache_ledger.rs'
      - 'src/compiler_cache_session.rs'
      - '.github/workflows/compiler-cache-key.yml'
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact head and physical tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git write-tree)" = "$(git rev-parse HEAD^{tree})"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          git rev-parse HEAD HEAD^{tree}
      - name: Compile production Rust crate and execute cache key vectors
        run: |
          set -eu
          rustc --version
          cargo test --lib compiler_cache_key::tests:: -- --nocapture
          cargo test --lib compiler_artifact_receipt::tests:: -- --nocapture
          cargo test --lib compiler_artifact_store::tests:: -- --nocapture
          cargo test --lib secure_fs::tests:: -- --nocapture
          cargo test --lib compiler_cache_witness::tests:: -- --nocapture
          cargo test --lib compiler_cache_key_policy::tests:: -- --nocapture
          cargo test --lib compiler_cache_ledger::tests:: -- --nocapture
          cargo test --test package_resolver -- --nocapture
          cargo test --test multihop_linker -- --nocapture
