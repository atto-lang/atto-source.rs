name: Canonical borrow checker (Rust models)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable carrier/source tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checked-out Git identity
        shell: bash
        run: |
          set -euo pipefail
          echo "checked_out_commit=$(git rev-parse HEAD)"
          echo "checked_out_root_tree=$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain)"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
          components: clippy,rustfmt
      - name: Verify Rust versions
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version
      - name: Format source before Clippy/semantic probe (non-exact-tree)
        run: cargo fmt --all
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run Rust unit tests (locked)
        run: cargo test --all-targets --locked
      - name: Run optimized Rust unit tests (locked)
        run: cargo test --all-targets --locked --release
