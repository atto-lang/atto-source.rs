name: Exact PR Atto virtual-hardware compiled Wasm guests
on:
  push:
    branches:
      - 'test/virtual-hardware-guest-*'
  pull_request:
    paths:
      - 'tests/virtual_hardware_guest.rs'
      - 'tests/virtual-hardware/**'
      - '.github/workflows/virtual-hardware-guest.yml'
permissions:
  contents: read
jobs:
  atto-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact local compiler checkout and PR source blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ATTO_COMPILER_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_COMPILER_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git hash-object tests/virtual-hardware/nic.atto)" = "a62174998a4e28f6367b5488d8426b5bb705f5e9"
          test "$(git hash-object tests/virtual-hardware/router.atto)" = "939290995ee2aa838385481eee39ded3e64fe1f1"
          test "$(git hash-object tests/virtual-hardware/switch.atto)" = "81d127d1f92028b80211c600122bd73dff950d64"
          test "$(git hash-object tests/virtual-hardware/modem.atto)" = "6af1b3f7d9c632468d9086fe3d11cebf141c872e"
      - name: Install pinned compiler toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustc --version
          node --version
      - name: Compile exact Atto virtual device source and execute produced guest Wasm
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --locked --test virtual_hardware_guest -- --nocapture
