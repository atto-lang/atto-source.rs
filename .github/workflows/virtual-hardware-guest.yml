name: Exact PR Atto virtual-hardware compiled Wasm guests
on:
  push:
    branches:
      - 'test/virtual-hardware-guest-*'
  pull_request:
    paths:
      - 'tests/virtual_hardware_guest.rs'
      - 'tests/virtual_hardware_actor_guest.rs'
      - 'tests/virtual-hardware/**'
      - '.github/workflows/virtual-hardware-guest.yml'
permissions:
  contents: read
jobs:
  atto-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact local compiler checkout and PR source blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ATTO_COMPILER_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_COMPILER_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git hash-object tests/virtual-hardware/nic.atto)" = "703d7a0ebe06901b97b9c5802bd115854b317c21"
          test "$(git hash-object tests/virtual-hardware/router.atto)" = "8cb7bfb98d99aa199e5625b77da82bc933cf578c"
          test "$(git hash-object tests/virtual-hardware/switch.atto)" = "4fff3d0beac96ba0057e065930d0686198536bc6"
          test "$(git hash-object tests/virtual-hardware/modem.atto)" = "57f929c9a6967862bfbfa7fc5134ac83f625062f"
      - name: Verify exact actor source Git blobs as well
        run: |
          set -euo pipefail
          test "$(git hash-object tests/virtual-hardware/nic_actor.atto)" = "781d7769698d710fa4891ea2c619444549e824c0"
          test "$(git hash-object tests/virtual-hardware/router_actor.atto)" = "0e19ba399777b0bfcc27f414625f978bd1bf2e75"
          test "$(git hash-object tests/virtual-hardware/switch_actor.atto)" = "b4200bba81e0c76fb3a80190d82f71e9a9d77991"
          test "$(git hash-object tests/virtual-hardware/modem_actor.atto)" = "cfe9e1b9115960f3f91eb5e17ebd499ddae54f9d"
      - name: Install pinned compiler toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustc --version
          node --version
      - name: Compile and execute actor-isolated Atto message sequences
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --locked --test virtual_hardware_actor_guest -- --nocapture
      - name: Compile exact Atto virtual device source and execute produced guest Wasm
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --locked --test virtual_hardware_guest -- --nocapture
