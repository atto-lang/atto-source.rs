name: Exact PR Atto virtual-hardware compiled Wasm guests
on:
  push:
    branches:
      - 'test/virtual-hardware-guest-*'
  pull_request:
    paths:
      - 'tests/virtual_hardware_guest.rs'
      - 'tests/virtual-hardware/**'
      - '.github/workflows/virtual-hardware-guest.yml'
permissions:
  contents: read
jobs:
  atto-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact local compiler checkout and PR source blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ATTO_COMPILER_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_COMPILER_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git hash-object tests/virtual-hardware/nic.atto)" = "e0ab46629285272d07cdeb36cfb11035d097b8ce"
          test "$(git hash-object tests/virtual-hardware/router.atto)" = "8d865668976ee8f1f9e7b60a3bd7a739cb4a9a5e"
          test "$(git hash-object tests/virtual-hardware/switch.atto)" = "6cd892821242b327660b7c010552b5549457acb4"
          test "$(git hash-object tests/virtual-hardware/modem.atto)" = "51fdf157f1c82606d1205cbbb27705e6a73129e1"
      - name: Install pinned compiler toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustc --version
          node --version
      - name: Compile exact Atto virtual device source and execute produced guest Wasm
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --locked --test virtual_hardware_guest -- --nocapture
