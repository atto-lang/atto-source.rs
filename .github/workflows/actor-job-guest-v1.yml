name: Job<int> compiled guest ABI — guarded compiler integration
on:
  push:
    paths:
      - 'src/ast.rs'
      - 'src/parser.rs'
      - 'src/check.rs'
      - 'src/wasm.rs'
      - 'src/job_envelope.rs'
      - 'tests/actor_job_guest_v1.rs'
      - '.github/workflows/actor-job-guest-v1.yml'
  pull_request:
    paths:
      - 'src/ast.rs'
      - 'src/parser.rs'
      - 'src/check.rs'
      - 'src/wasm.rs'
      - 'src/job_envelope.rs'
      - 'tests/actor_job_guest_v1.rs'
      - '.github/workflows/actor-job-guest-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
      - name: Compile and test the Rust compiler including job ABI fixtures
        run: cargo +1.85.1 test --locked --all-targets
      - name: Build actual browser compiler
        run: cargo +1.85.1 rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
      - name: Fail closed on missing guest contract marker and tests
        run: |
          grep -q 'actor_receive_job' src/wasm.rs
          grep -q 'actor_job_ack' src/check.rs
          grep -q 'job_receive_compiles_to_real_deterministic_wasm' tests/actor_job_guest_v1.rs
