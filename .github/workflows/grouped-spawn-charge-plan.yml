name: Rust grouped spawn charge plan (host only)
on:
  pull_request:
    paths:
      - 'src/actor_spawn_charge_plan.rs'
      - '.github/workflows/grouped-spawn-charge-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  charge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact head and standalone Rust checks
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'head=%s tree=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
          rustc --version
          rustc --edition=2021 --test -D warnings src/actor_spawn_charge_plan.rs -o /tmp/atto-spawn-charge
          /tmp/atto-spawn-charge
          rustc --edition=2021 --test -D warnings -O src/actor_spawn_charge_plan.rs -o /tmp/atto-spawn-charge-opt
          /tmp/atto-spawn-charge-opt
