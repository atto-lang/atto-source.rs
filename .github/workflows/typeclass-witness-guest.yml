name: Compile-time typeclass witness guest
on:
  pull_request:
    paths:
      - 'src/typeclass_witness.rs'
      - 'src/lib.rs'
      - 'tests/typeclass_witness_guest.mjs'
      - 'docs/TYPECLASS_WITNESS_SCALAR_V1.md'
      - '.github/workflows/typeclass-witness-guest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head, tree, and source blob
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git hash-object src/typeclass_witness.rs
      - name: Select pinned Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup component add clippy --toolchain 1.85.1
          rustup default 1.85.1
      - name: Execute lowering and full compiler library tests
        run: |
          cargo test --locked --lib typeclass_witness
          RUST_MIN_STACK=16777216 cargo test --locked --lib
      - name: Clippy without warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build native source compiler
        run: cargo build --locked --release --bin attoc
      - name: Execute compiled Wasm and fail-before-output negative cases
        env:
          ATTOC: target/release/attoc
        run: node tests/typeclass_witness_guest.mjs
